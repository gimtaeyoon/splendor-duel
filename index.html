  <div id="app" class="app">
    <!-- 홈 -->
    <section id="scr-home" class="screen" aria-label="홈">
      <div class="home-wrap" id="home-root"></div>
    </section>
    <!-- 대기실 -->
    <section id="scr-lobby" class="screen" hidden aria-label="대기실">
      <div class="lobby-wrap" id="lobby-root"></div>
    </section>
    <!-- 게임 -->
    <section id="scr-game" class="screen" hidden aria-label="게임">
      <header class="topbar" id="g-top"></header>
      <div class="netbar" id="g-net" hidden></div>
      <main class="game-grid" id="g-grid">
        <div class="area area-opp" id="g-opp"></div>
        <div class="area area-banner" id="g-banner" aria-live="polite"></div>
        <div class="area area-market" id="g-market"></div>
        <div class="area area-board" id="g-board"></div>
        <div class="area area-me" id="g-me"></div>
      </main>
      <div class="actionbar" id="g-bar"></div>
    </section>
